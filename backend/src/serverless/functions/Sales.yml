sales:
  handler: src/functions/api/sales.handler
  events:
    - http:
        path: sales
        method: get
        authorizer: verifyToken
        cors: true 
    - http:
        path: sales/{id}
        method: get
        authorizer: verifyToken
        cors: true 
    - http:
        path: sales
        method: post
        authorizer: verifyToken
        cors: true  
    - http:
        path: sales
        method: put
        authorizer: verifyToken
        cors: true 
    - http:
        path: sales/{id}
        method: delete
        authorizer: verifyToken
        cors: true

salesByIdPublic:
  handler: src/functions/api/sales.listByIdPublic
  events:
    - http:
        path: sales/contract/{id}
        method: get
        cors: true 
salesUpdatePublic:
  handler: src/functions/api/sales.updatePublic
  events:
    - http:
        path: sales/contract
        method: put
        cors: true 
