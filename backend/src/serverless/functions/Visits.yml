visits:
  handler: src/functions/api/visits.handler
  events:
    - http:
        path: visits
        method: get
        authorizer: verifyToken
        cors: true 
    - http:
        path: visits/{id}
        method: get
        authorizer: verifyToken
        cors: true 
    - http:
        path: visits/all
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: visits
        method: post
        authorizer: verifyToken
        cors: true  
    - http:
        path: visits
        method: put
        authorizer: verifyToken
        cors: true 
    - http:
        path: visits/{id}
        method: delete
        authorizer: verifyToken
        cors: true