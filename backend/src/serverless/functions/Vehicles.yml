vehicles:
  handler: src/functions/api/vehicles.handler
  events:
    - http:
        path: vehicles
        method: get
        authorizer: verifyToken
        cors: true 
    - http:
        path: vehicles/{id}
        method: get
        authorizer: verifyToken
        cors: true 
    - http:
        path: vehicles/all
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: vehicles
        method: post
        authorizer: verifyToken
        cors: true  
    - http:
        path: vehicles
        method: put
        authorizer: verifyToken
        cors: true 
    - http:
        path: vehicles/{id}
        method: delete
        authorizer: verifyToken
        cors: true